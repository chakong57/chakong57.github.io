<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Blog</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%231f883d'/%3E%3Cpath d='M9 11h14M9 16h14M9 21h9' stroke='white' stroke-width='2.5' stroke-linecap='round'/%3E%3C/svg%3E">
<style>
/* ========== GitHub 风格变量 ========== */
:root{
  --bg:#ffffff;
  --fg:#1f2328;
  --muted:#59636e;
  --subtle:#6e7781;
  --border:#d0d7de;
  --border-muted:hsla(210,18%,87%,1);
  --canvas-subtle:#f6f8fa;
  --accent:#0969da;
  --accent-bg:#ddf4ff;
  --accent-fg:#0a4fa3;
  --success:#1a7f37;
  --success-bg:#dafbe1;
  --danger:#d1242f;
  --danger-bg:#ffebe9;
  --btn-bg:#f6f8fa;
  --btn-hover:#f3f4f6;
  --btn-border:rgba(31,35,40,.15);
  --primary:#1f883d;
  --primary-hover:#1a7f37;
  --radius:6px;
  --font:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans",Helvetica,Arial,sans-serif,"Apple Color Emoji","Segoe UI Emoji";
  --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace;
}

/* ========== 基础 ========== */
*{box-sizing:border-box}
body{margin:0;font-family:var(--font);color:var(--fg);background:var(--bg);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
a{color:var(--accent);text-decoration:none}
a:hover{text-decoration:underline}
button{font-family:inherit}
input,textarea{font-family:inherit}
[hidden]{display:none!important}
.container{max-width:1012px;margin:0 auto;padding:24px 16px 64px}
.spacer{flex:1}

/* ========== 顶部导航 ========== */
.header{position:sticky;top:0;z-index:10;background:var(--bg);border-bottom:1px solid var(--border-muted);padding:0 16px;height:56px;display:flex;align-items:center;gap:10px}
.brand{display:flex;align-items:center;gap:8px;font-size:16px;font-weight:600;cursor:pointer;user-select:none;white-space:nowrap}
.brand:hover .brand-name{color:var(--accent)}

/* ========== 按钮 ========== */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:5px 16px;font-size:14px;font-weight:500;line-height:20px;white-space:nowrap;border:1px solid var(--btn-border);border-radius:var(--radius);background:var(--btn-bg);color:var(--fg);cursor:pointer;transition:background .1s;user-select:none}
.btn:hover{background:var(--btn-hover)}
.btn:active{background:var(--canvas-subtle)}
.btn-primary{background:var(--primary);border-color:rgba(31,35,40,.15);color:#fff}
.btn-primary:hover{background:var(--primary-hover)}
.btn-danger{color:var(--danger)}
.btn-danger:hover{background:var(--danger-bg)}
.btn-sm{padding:3px 12px;font-size:12px}

/* ========== 输入框 ========== */
.input{width:100%;padding:6px 12px;font-size:14px;line-height:20px;color:var(--fg);background:var(--bg);border:1px solid var(--border);border-radius:var(--radius);outline:none}
.input::placeholder{color:var(--subtle)}
.input:focus{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
textarea.input{font-family:var(--mono);line-height:1.6;resize:vertical}

/* ========== 首页 ========== */
.home-head{margin:8px 0 20px}
.home-head h1{font-size:28px;font-weight:600;margin:0 0 4px}
.home-desc{color:var(--muted);font-size:15px;margin:0}
.search{position:relative;margin-bottom:8px}
.search svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--subtle);pointer-events:none}
.search .input{padding-left:32px}
.list-meta{color:var(--muted);font-size:12px;margin:8px 2px 12px}
.posts{border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;background:var(--bg)}
.post-item{padding:12px 16px;border-bottom:1px solid var(--border-muted);transition:background .1s}
.post-item:last-child{border-bottom:0}
.post-item:hover{background:var(--canvas-subtle)}
.post-title{font-size:16px;font-weight:600;color:var(--accent);display:inline-block}
.post-title:hover{text-decoration:underline}
.post-excerpt{color:var(--muted);margin:4px 0 8px;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.post-meta{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:12px;color:var(--subtle)}
.label{display:inline-block;padding:0 8px;font-size:12px;font-weight:500;line-height:18px;border-radius:2em;background:var(--accent-bg);color:var(--accent-fg);border:1px solid transparent}

/* ========== 空状态 ========== */
.empty{text-align:center;padding:64px 16px;color:var(--muted)}
.empty svg{margin-bottom:16px;color:var(--subtle)}
.empty .title{font-size:20px;font-weight:600;color:var(--fg);margin:0 0 8px}
.empty p{margin:0 0 16px}

/* ========== 页面头部（编辑器 / 详情页） ========== */
.page-head{display:flex;align-items:center;gap:12px;margin:8px 0 20px}
.page-head h1{font-size:20px;font-weight:600;margin:0}

/* ========== 编辑器 ========== */
.editor-title{font-size:20px;font-weight:600;margin-bottom:12px}
.editor-tags{margin-bottom:12px}
.tabs{display:flex;gap:0;border-bottom:1px solid var(--border)}
.tab{padding:8px 16px;font-size:14px;font-weight:500;color:var(--muted);background:none;border:none;border-bottom:2px solid transparent;cursor:pointer;margin-bottom:-1px}
.tab:hover{color:var(--fg)}
.tab.active{color:var(--fg);border-bottom-color:var(--accent)}
.toolbar{display:flex;align-items:center;gap:2px;margin:8px 0;flex-wrap:wrap}
.tool-btn{display:inline-flex;align-items:center;justify-content:center;min-width:32px;height:32px;padding:0 6px;font-size:14px;color:var(--muted);background:none;border:1px solid transparent;border-radius:var(--radius);cursor:pointer}
.tool-btn:hover{background:var(--canvas-subtle);color:var(--fg)}
.tool-btn b{font-weight:700}
.editor-body{display:block;min-height:340px}
.editor-preview{border:1px solid var(--border);border-radius:var(--radius);padding:12px 16px;min-height:340px;overflow:auto;background:var(--bg)}
.hint{color:var(--subtle);font-size:12px;margin:8px 0 0}
.editor-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}

/* ========== 文章详情 ========== */
.post-head{padding-bottom:16px;border-bottom:1px solid var(--border-muted);margin-bottom:20px}
.post-head h1{font-size:32px;font-weight:600;margin:0 0 8px;line-height:1.3}

/* ========== Markdown 渲染（GitHub 风格） ========== */
.markdown{font-size:16px;line-height:1.6;word-wrap:break-word}
.markdown h1,.markdown h2{padding-bottom:.3em;border-bottom:1px solid var(--border-muted)}
.markdown h1{font-size:2em;margin:1em 0 .5em}
.markdown h2{font-size:1.5em;margin:1em 0 .5em}
.markdown h3{font-size:1.25em;margin:1em 0 .5em}
.markdown h4{font-size:1em;margin:1em 0 .5em}
.markdown p{margin:0 0 16px}
.markdown a{color:var(--accent)}
.markdown a:hover{text-decoration:underline}
.markdown img{max-width:100%;border-radius:6px;display:block;margin:8px 0}
.markdown code{font-family:var(--mono);font-size:85%;padding:.2em .4em;background:rgba(175,184,193,.2);border-radius:6px}
.markdown pre{background:var(--canvas-subtle);border:1px solid var(--border-muted);border-radius:var(--radius);padding:16px;overflow:auto;line-height:1.45;margin:0 0 16px}
.markdown pre code{background:transparent;padding:0;font-size:85%}
.markdown blockquote{padding:0 1em;color:var(--muted);border-left:.25em solid var(--border);margin:0 0 16px}
.markdown ul,.markdown ol{padding-left:2em;margin:0 0 16px}
.markdown li{margin:.25em 0}
.markdown hr{height:1px;border:0;background:var(--border-muted);margin:24px 0}

/* ========== 设置弹窗 ========== */
dialog{border:1px solid var(--border);border-radius:12px;padding:0;box-shadow:0 8px 24px rgba(140,149,159,.2);width:min(480px,92vw);color:var(--fg)}
dialog::backdrop{background:rgba(31,35,40,.5)}
.dialog-header{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;border-bottom:1px solid var(--border-muted);font-size:16px;font-weight:600}
.dialog-close{background:none;border:none;font-size:16px;color:var(--subtle);cursor:pointer;padding:4px}
.dialog-close:hover{color:var(--fg)}
.dialog-body{padding:16px}
.field-label{display:block;font-weight:600;font-size:14px;margin:0 0 6px}
.dialog-body .input{margin-bottom:16px}
.dialog-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:4px}
.dialog-section{border-top:1px solid var(--border-muted);padding-top:14px;margin-top:4px}

/* ========== 提示条（GitHub Flash 风格） ========== */
.flash{position:fixed;top:0;left:0;right:0;z-index:100;transform:translateY(-100%);transition:transform .25s ease;padding:12px 16px;text-align:center;font-size:14px;font-weight:500}
.flash.show{transform:translateY(0)}
.flash.success{background:var(--success-bg);color:var(--success);border-bottom:1px solid var(--btn-border)}
.flash.error{background:var(--danger-bg);color:var(--danger);border-bottom:1px solid var(--btn-border)}

/* ========== 页脚 ========== */
.footer{border-top:1px solid var(--border-muted);padding:24px 16px;text-align:center;color:var(--subtle);font-size:12px;display:flex;flex-direction:column;gap:4px}

/* ========== 移动端 ========== */
@media (max-width:768px){
  .header{padding:0 12px;gap:8px}
  .btn{padding:5px 10px;font-size:13px}
  .post-head h1{font-size:26px}
  .home-head h1{font-size:24px}
}
</style>
</head>
<body>

<!-- ===== 顶部导航 ===== -->
<header class="header">
  <div class="brand" onclick="renderHome()" title="回到首页">
    <svg width="28" height="28" viewBox="0 0 32 32"><rect width="32" height="32" rx="6" fill="#1f883d"/><path d="M9 11h14M9 16h14M9 21h9" stroke="#fff" stroke-width="2.5" stroke-linecap="round"/></svg>
    <span id="brand-title" class="brand-name">My Blog</span>
  </div>
  <div class="spacer"></div>
  <button class="btn btn-primary" onclick="openEditor()">
    <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor"><path d="M7.75 2a.75.75 0 0 1 .75.75V7h4.25a.75.75 0 0 1 0 1.5H8.5v4.25a.75.75 0 0 1-1.5 0V8.5H2.75a.75.75 0 0 1 0-1.5H7V2.75A.75.75 0 0 1 7.75 2Z"/></svg>
    写文章
  </button>
  <button class="btn" onclick="openSettings()">设置</button>
</header>

<main class="container">

  <!-- ===== 首页：文章列表 ===== -->
  <section id="view-home">
    <div class="home-head">
      <h1 id="home-title">My Blog</h1>
      <p id="home-desc" class="home-desc"></p>
    </div>
    <div class="search">
      <svg viewBox="0 0 16 16" width="16" height="16" fill="currentColor"><path d="M10.68 11.74a6 6 0 0 1-7.922-8.982 6 6 0 0 1 8.982 7.922l3.04 3.04a.749.749 0 0 1-.326 1.275.749.749 0 0 1-.734-.215ZM11.5 7a4.499 4.499 0 1 0-8.997 0A4.499 4.499 0 0 0 11.5 7Z"></path></svg>
      <input id="search-input" class="input" placeholder="搜索文章…" oninput="renderHome()">
    </div>
    <div class="list-meta">共 <b id="post-count">0</b> 篇文章</div>
    <div id="posts-list" class="posts"></div>
  </section>

  <!-- ===== 编辑器 ===== -->
  <section id="view-editor" hidden>
    <div class="page-head">
      <button class="btn btn-sm" onclick="backFromEditor()">← 返回</button>
      <h1 id="editor-heading">写文章</h1>
    </div>
    <input id="editor-title-input" class="input editor-title" placeholder="文章标题" maxlength="120">
    <input id="editor-tags-input" class="input editor-tags" placeholder="标签（可选），用逗号分隔，例如：技术, 随笔">
    <div class="tabs">
      <button id="tab-write" class="tab active" onclick="switchTab('write')">写</button>
      <button id="tab-preview" class="tab" onclick="switchTab('preview')">预览</button>
    </div>
    <div class="toolbar">
      <button class="tool-btn" title="加粗" onclick="wrapSelection('**','**','加粗文字')"><b>B</b></button>
      <button class="tool-btn" title="斜体" onclick="wrapSelection('*','*','斜体文字')"><i>I</i></button>
      <button class="tool-btn" title="标题" onclick="wrapSelection('# ','','')">H1</button>
      <button class="tool-btn" title="行内代码" onclick="wrapSelection('`','`','code')">&lt;/&gt;</button>
      <button class="tool-btn" title="链接" onclick="wrapSelection('[','](https://example.com)','链接文字')">🔗</button>
      <button class="tool-btn" title="引用" onclick="wrapSelection('&gt; ','','引用文字')">❝</button>
      <button class="tool-btn" title="无序列表" onclick="wrapSelection('- ','','列表项')">•</button>
      <span class="toolbar-sep" style="width:1px;height:20px;background:var(--border);margin:0 6px"></span>
      <button class="tool-btn" title="上传图片（支持拖拽到编辑区）" onclick="document.getElementById('image-input').click()">🖼 图片</button>
      <input type="file" id="image-input" accept="image/*" multiple hidden onchange="handleImageInput(this)">
    </div>
    <textarea id="editor-body" class="input editor-body" placeholder="支持 Markdown 语法…

可以点击工具栏的「图片」按钮，或直接把图片拖进本编辑区，图片会自动压缩后插入。"></textarea>
    <div id="editor-preview" class="editor-preview markdown" style="display:none"></div>
    <p class="hint">提示：文章与图片保存在当前浏览器的本地存储中；可通过「设置 → 导出备份」保存数据文件。</p>
    <div class="editor-actions">
      <button class="btn" onclick="backFromEditor()">取消</button>
      <button class="btn btn-primary" onclick="savePost()">保存文章</button>
    </div>
  </section>

  <!-- ===== 文章详情 ===== -->
  <section id="view-post" hidden>
    <div class="page-head">
      <button class="btn btn-sm" onclick="renderHome()">← 返回</button>
      <div class="spacer"></div>
      <button class="btn btn-sm" id="btn-edit-post">编辑</button>
      <button class="btn btn-sm btn-danger" id="btn-del-post">删除</button>
    </div>
    <article>
      <header class="post-head">
        <h1 id="post-title"></h1>
        <div class="post-meta">
          <span id="post-date"></span>
          <span>·</span>
          <span id="post-wordcount"></span>
          <span id="post-tags"></span>
        </div>
      </header>
      <div id="post-body" class="markdown"></div>
    </article>
  </section>

</main>

<!-- ===== 设置弹窗 ===== -->
<dialog id="settings-dialog">
  <div class="dialog-header">设置<span class="dialog-close" onclick="document.getElementById('settings-dialog').close()" title="关闭">✕</span></div>
  <div class="dialog-body">
    <label class="field-label" for="set-title">站点标题</label>
    <input id="set-title" class="input" placeholder="My Blog" maxlength="60">
    <label class="field-label" for="set-desc">站点简介</label>
    <input id="set-desc" class="input" placeholder="一句话介绍你的博客" maxlength="200">
    <div class="dialog-section">
      <label class="field-label">数据管理</label>
      <div class="dialog-actions" style="justify-content:flex-start">
        <button class="btn btn-sm" onclick="exportData()">导出备份</button>
        <label class="btn btn-sm">导入备份<input type="file" id="import-input" accept=".json,application/json" hidden onchange="handleImport(this)"></label>
      </div>
      <p class="hint" style="margin-top:10px">文章与图片保存在当前浏览器的本地存储中；导出备份文件后可随时恢复或迁移到其他设备。</p>
    </div>
    <div class="dialog-actions">
      <button class="btn" onclick="document.getElementById('settings-dialog').close()">取消</button>
      <button class="btn btn-primary" onclick="saveSettings()">保存</button>
    </div>
  </div>
</dialog>

<!-- ===== 提示条 ===== -->
<div id="flash" class="flash" role="status"></div>

<!-- ===== 页脚 ===== -->
<footer class="footer">
  <span>© <span id="footer-year"></span> <span id="footer-title"></span></span>
  <span>文章与图片存储于浏览器本地 · 通过「设置 → 导出备份」迁移数据</span>
</footer>

<script>
'use strict';

/* ================= 数据层（localStorage） ================= */
var POSTS_KEY = 'xcom57blog:posts:v1';
var SETTINGS_KEY = 'xcom57blog:settings:v1';
var posts = [];
var settings = { title: 'My Blog', desc: '' };
var editingId = null;
var flashTimer = null;

function $(id) { return document.getElementById(id); }

function loadPosts() {
  try { posts = JSON.parse(localStorage.getItem(POSTS_KEY)) || []; }
  catch (e) { posts = []; }
  if (!Array.isArray(posts)) posts = [];
}
function savePosts() {
  try {
    localStorage.setItem(POSTS_KEY, JSON.stringify(posts));
  } catch (e) {
    flash('保存失败：本地存储空间不足（图片过多或过大），请删除部分图片或先导出备份', 'error');
  }
}
function loadSettings() {
  try {
    var s = JSON.parse(localStorage.getItem(SETTINGS_KEY));
    if (s && typeof s === 'object') settings = Object.assign(settings, s);
  } catch (e) { /* 使用默认设置 */ }
}
function saveSettings() {
  settings.title = $('set-title').value.trim() || 'My Blog';
  settings.desc = $('set-desc').value.trim();
  localStorage.setItem(SETTINGS_KEY, JSON.stringify(settings));
  $('settings-dialog').close();
  applySettings();
  renderHome();
  flash('设置已保存');
}
function applySettings() {
  $('brand-title').textContent = settings.title;
  $('home-title').textContent = settings.title;
  $('home-desc').textContent = settings.desc;
  $('footer-title').textContent = settings.title;
  document.title = settings.title;
}

/* ================= 视图切换 ================= */
function showView(name) {
  ['home', 'editor', 'post'].forEach(function (v) {
    $('view-' + v).hidden = (v !== name);
  });
}

/* ================= 首页 ================= */
function renderHome() {
  var q = $('search-input').value.trim().toLowerCase();
  var list = posts;
  if (q) {
    list = posts.filter(function (p) {
      return (p.title + ' ' + p.body + ' ' + (p.tags || []).join(' ')).toLowerCase().indexOf(q) !== -1;
    });
  }
  $('post-count').textContent = list.length;
  var el = $('posts-list');
  if (!list.length) {
    el.innerHTML = '<div class="empty">'
      + '<svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="4" y="2.5" width="16" height="19" rx="2"/><path d="M8 8h8M8 12h8M8 16h5"/></svg>'
      + '<p class="title">' + (q ? '没有找到相关文章' : '还没有文章') + '</p>'
      + '<p>' + (q ? '换个关键词试试' : '开始写你的第一篇文章吧') + '</p>'
      + (q ? '' : '<button class="btn btn-primary" onclick="openEditor()">写文章</button>')
      + '</div>';
  } else {
    el.innerHTML = list.map(function (p) {
      var tags = (p.tags || []).map(function (t) {
        return '<span class="label">' + escapeHtml(t) + '</span>';
      }).join('');
      return '<div class="post-item">'
        + '<a class="post-title" href="javascript:void(0)" onclick="openPost(' + p.id + ')">' + escapeHtml(p.title) + '</a>'
        + '<div class="post-excerpt">' + escapeHtml(excerpt(p.body)) + '</div>'
        + '<div class="post-meta"><span>' + relTime(p.createdAt) + '</span><span>·</span><span>' + wordCount(p.body) + ' 字</span>' + tags + '</div>'
        + '</div>';
    }).join('');
  }
  showView('home');
  window.scrollTo(0, 0);
}

/* ================= 编辑器 ================= */
function openEditor(id) {
  editingId = id || null;
  var post = id ? posts.find(function (p) { return p.id === id; }) : null;
  $('editor-heading').textContent = post ? '编辑文章' : '写文章';
  $('editor-title-input').value = post ? post.title : '';
  $('editor-tags-input').value = post ? (post.tags || []).join(', ') : '';
  $('editor-body').value = post ? post.body : '';
  switchTab('write');
  showView('editor');
  window.scrollTo(0, 0);
  $('editor-title-input').focus();
}

function backFromEditor() {
  if (editingId) openPost(editingId);
  else renderHome();
}

function switchTab(tab) {
  $('tab-write').classList.toggle('active', tab === 'write');
  $('tab-preview').classList.toggle('active', tab === 'preview');
  $('editor-body').style.display = (tab === 'write') ? 'block' : 'none';
  $('editor-preview').style.display = (tab === 'preview') ? 'block' : 'none';
  if (tab === 'preview') updatePreview();
}

function updatePreview() {
  $('editor-preview').innerHTML = mdToHtml($('editor-body').value);
}

/* 在光标处包裹 / 插入文本 */
function wrapSelection(before, after, placeholder) {
  var ta = $('editor-body');
  var s = ta.selectionStart, e = ta.selectionEnd;
  var sel = ta.value.slice(s, e) || placeholder;
  ta.value = ta.value.slice(0, s) + before + sel + after + ta.value.slice(e);
  ta.selectionStart = s + before.length;
  ta.selectionEnd = s + before.length + sel.length;
  ta.focus();
  updatePreview();
}

function savePost() {
  var title = $('editor-title-input').value.trim();
  var body = $('editor-body').value;
  var tags = $('editor-tags-input').value.split(/[,，]/).map(function (s) { return s.trim(); }).filter(Boolean);
  if (!title) {
    flash('请填写文章标题', 'error');
    $('editor-title-input').focus();
    return;
  }
  var now = Date.now();
  if (editingId) {
    var p = posts.find(function (x) { return x.id === editingId; });
    if (p) { p.title = title; p.body = body; p.tags = tags; p.updatedAt = now; }
  } else {
    posts.unshift({ id: now, title: title, body: body, tags: tags, createdAt: now, updatedAt: now });
    editingId = now;
  }
  savePosts();
  flash('文章已保存');
  openPost(editingId);
}

/* ================= 文章详情 ================= */
function openPost(id) {
  var p = posts.find(function (x) { return x.id === id; });
  if (!p) { renderHome(); return; }
  $('post-title').textContent = p.title;
  var dateStr = '发布于 ' + relTime(p.createdAt);
  if (p.updatedAt > p.createdAt) dateStr += ' · 更新于 ' + relTime(p.updatedAt);
  $('post-date').textContent = dateStr;
  $('post-wordcount').textContent = wordCount(p.body) + ' 字';
  $('post-tags').innerHTML = (p.tags && p.tags.length)
    ? p.tags.map(function (t) { return '<span class="label">' + escapeHtml(t) + '</span>'; }).join(' ')
    : '';
  $('post-body').innerHTML = mdToHtml(p.body);
  $('btn-edit-post').onclick = function () { openEditor(p.id); };
  $('btn-del-post').onclick = function () { deletePost(p.id); };
  showView('post');
  window.scrollTo(0, 0);
}

function deletePost(id) {
  var p = posts.find(function (x) { return x.id === id; });
  if (!p) return;
  if (!confirm('确定删除《' + p.title + '》吗？此操作不可恢复。')) return;
  posts = posts.filter(function (x) { return x.id !== id; });
  savePosts();
  flash('文章已删除');
  renderHome();
}

/* ================= 图片上传（压缩为 Base64 存入本地） ================= */
function handleImageInput(input) {
  handleFiles(input.files);
  input.value = '';
}

function handleFiles(files) {
  if (!files || !files.length) return;
  Array.prototype.forEach.call(files, function (f) {
    if (!f.type || f.type.indexOf('image/') !== 0) {
      flash('仅支持图片文件', 'error');
      return;
    }
    if (f.type === 'image/gif') {
      fileToDataUrl(f).then(function (url) {
        insertAtCursor('\n![图片](' + url + ')\n');
        flash('图片已插入');
      });
    } else {
      compressImage(f).then(function (url) {
        insertAtCursor('\n![图片](' + url + ')\n');
        flash('图片已插入（已自动压缩）');
      });
    }
  });
}

function fileToDataUrl(file) {
  return new Promise(function (resolve, reject) {
    var r = new FileReader();
    r.onload = function () { resolve(r.result); };
    r.onerror = reject;
    r.readAsDataURL(file);
  });
}

/* 用 canvas 压缩图片：最长边限制 1280px，JPEG 质量 0.82 */
function compressImage(file) {
  return new Promise(function (resolve, reject) {
    var r = new FileReader();
    r.onload = function () {
      var img = new Image();
      img.onload = function () {
        var MAX = 1280;
        var w = img.width, h = img.height;
        if (w > MAX) { h = Math.round(h * MAX / w); w = MAX; }
        var canvas = document.createElement('canvas');
        canvas.width = w;
        canvas.height = h;
        var ctx = canvas.getContext('2d');
        if (file.type === 'image/png') ctx.clearRect(0, 0, w, h);
        ctx.drawImage(img, 0, 0, w, h);
        var url = (file.type === 'image/png')
          ? canvas.toDataURL('image/png')
          : canvas.toDataURL('image/jpeg', 0.82);
        resolve(url);
      };
      img.onerror = function () { resolve(r.result); }; /* 压缩失败则用原图 */
      img.src = r.result;
    };
    r.onerror = reject;
    r.readAsDataURL(file);
  });
}

function insertAtCursor(text) {
  var ta = $('editor-body');
  var s = ta.selectionStart, e = ta.selectionEnd;
  ta.value = ta.value.slice(0, s) + text + ta.value.slice(e);
  ta.selectionStart = ta.selectionEnd = s + text.length;
  ta.focus();
  updatePreview();
}

/* 拖拽图片到编辑区 */
(function () {
  var ta = $('editor-body');
  ['dragover', 'drop'].forEach(function (ev) {
    ta.addEventListener(ev, function (e) {
      e.preventDefault();
      if (ev === 'drop') handleFiles(e.dataTransfer.files);
    });
  });
})();

/* ================= 备份：导出 / 导入 ================= */
function exportData() {
  var data = { site: settings, posts: posts, exportedAt: new Date().toISOString() };
  var blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
  var a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = (settings.title || 'blog').replace(/[\\/:*?"<>|]/g, '-') + '-backup-' + new Date().toISOString().slice(0, 10) + '.json';
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(a.href);
  flash('已导出备份文件');
}

function handleImport(input) {
  var f = input.files[0];
  input.value = '';
  if (!f) return;
  var r = new FileReader();
  r.onload = function () {
    try {
      var d = JSON.parse(r.result);
      if (!d || !Array.isArray(d.posts)) throw new Error('文件格式不正确');
      if (!confirm('导入将覆盖当前全部 ' + posts.length + ' 篇文章，确定继续？')) return;
      posts = d.posts;
      if (d.site && typeof d.site === 'object') {
        settings = Object.assign(settings, d.site);
        localStorage.setItem(SETTINGS_KEY, JSON.stringify(settings));
      }
      savePosts();
      applySettings();
      renderHome();
      flash('导入成功，共 ' + posts.length + ' 篇文章');
    } catch (e) {
      flash('导入失败：' + e.message, 'error');
    }
  };
  r.readAsText(f, 'utf-8');
}

/* ================= 设置弹窗 ================= */
function openSettings() {
  $('set-title').value = settings.title;
  $('set-desc').value = settings.desc;
  $('settings-dialog').showModal();
}

/* ================= 提示条 ================= */
function flash(msg, type) {
  var el = $('flash');
  el.textContent = msg;
  el.className = 'flash show ' + (type || 'success');
  clearTimeout(flashTimer);
  flashTimer = setTimeout(function () { el.classList.remove('show'); }, 3200);
}

/* ================= 工具函数 ================= */
function escapeHtml(s) {
  return String(s)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#39;');
}

function isSafeUrl(u) {
  u = String(u).trim();
  if (/^(https?:|mailto:|#)/i.test(u)) return true;
  if (u.indexOf('/') === 0 || u.indexOf('./') === 0 || u.indexOf('../') === 0) return true;
  if (/^data:image\//i.test(u)) return true;
  return false;
}

function relTime(ts) {
  var diff = Date.now() - ts;
  var m = Math.floor(diff / 60000);
  if (m < 1) return '刚刚';
  if (m < 60) return m + ' 分钟前';
  var h = Math.floor(m / 60);
  if (h < 24) return h + ' 小时前';
  var day = Math.floor(h / 24);
  if (day < 30) return day + ' 天前';
  var d = new Date(ts);
  function pad(n) { return n < 10 ? '0' + n : '' + n; }
  return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
}

function wordCount(body) {
  return String(body || '').replace(/\s+/g, '').length;
}

/* 摘要：去除 Markdown 标记后截断 */
function excerpt(body) {
  var t = String(body || '')
    .replace(/```[\s\S]*?```/g, ' ')
    .replace(/!\[[^\]]*\]\([^)]*\)/g, ' ')
    .replace(/\[([^\]]+)\]\([^)]*\)/g, '$1')
    .replace(/[#>*_`~|]/g, '')
    .replace(/\s+/g, ' ')
    .trim();
  return t.length > 150 ? t.slice(0, 150) + '…' : t;
}

/* ================= Markdown 渲染（安全、无依赖） ================= */
function inline(s) {
  var t = escapeHtml(s);
  var stash = []; /* 先保护 code / 图片 / 链接，防止被后续规则破坏 */
  var stashRe = /\u0000(\d+)\u0000/g;
  t = t.replace(/`([^`]+)`/g, function (m, c) {
    stash.push('<code>' + c + '</code>');
    return '\u0000' + (stash.length - 1) + '\u0000';
  });
  t = t.replace(/!\[([^\]]*)\]\(([^)\s]+)(?:\s+"[^"]*")?\)/g, function (m, alt, src) {
    if (!isSafeUrl(src)) return m;
    stash.push('<img src="' + src + '" alt="' + escapeHtml(alt) + '" loading="lazy">');
    return '\u0000' + (stash.length - 1) + '\u0000';
  });
  t = t.replace(/\[([^\]]+)\]\(([^)\s]+)(?:\s+"[^"]*")?\)/g, function (m, txt, url) {
    if (!isSafeUrl(url)) return m;
    stash.push('<a href="' + url + '" rel="noopener noreferrer">' + escapeHtml(txt) + '</a>');
    return '\u0000' + (stash.length - 1) + '\u0000';
  });
  t = t.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
  t = t.replace(/(^|[^*])\*([^*\n]+)\*/g, '$1<em>$2</em>');
  t = t.replace(stashRe, function (m, n) { return stash[+n]; });
  return t;
}

function isBlockStart(l) {
  return /^(#{1,6}\s+|```|>\s?|[-*+]\s+|\d+\.\s+)/.test(l) || /^-{3,}\s*$/.test(l);
}

function mdToHtml(md) {
  if (!md) return '';
  var lines = String(md).replace(/\r\n/g, '\n').split('\n');
  var html = '';
  var i = 0;
  while (i < lines.length) {
    var line = lines[i];
    var code = line.match(/^```([\w+-]*)\s*$/);
    if (code) {
      var buf = [];
      i++;
      while (i < lines.length && !/^```\s*$/.test(lines[i])) { buf.push(lines[i]); i++; }
      i++; /* 跳过结尾 ``` */
      html += '<pre><code' + (code[1] ? ' class="language-' + escapeHtml(code[1]) + '"' : '') + '>'
        + escapeHtml(buf.join('\n')) + '</code></pre>\n';
      continue;
    }
    var heading = line.match(/^(#{1,6})\s+(.*)$/);
    if (heading) {
      var level = heading[1].length;
      html += '<h' + level + '>' + inline(heading[2]) + '</h' + level + '>\n';
      i++;
      continue;
    }
    if (/^>\s?/.test(line)) {
      var q = [];
      while (i < lines.length && /^>\s?/.test(lines[i])) { q.push(lines[i].replace(/^>\s?/, '')); i++; }
      html += '<blockquote>' + q.map(function (l) { return inline(l); }).join('<br>') + '</blockquote>\n';
      continue;
    }
    if (/^[-*+]\s+/.test(line) || /^\d+\.\s+/.test(line)) {
      var ordered = /^\d+\.\s+/.test(line);
      var items = [];
      while (i < lines.length && (/^[-*+]\s+/.test(lines[i]) || /^\d+\.\s+/.test(lines[i]))) {
        items.push(lines[i].replace(/^[-*+]\s+/, '').replace(/^\d+\.\s+/, ''));
        i++;
      }
      html += (ordered ? '<ol>' : '<ul>')
        + items.map(function (it) { return '<li>' + inline(it) + '</li>'; }).join('')
        + (ordered ? '</ol>' : '</ul>') + '\n';
      continue;
    }
    if (/^-{3,}\s*$/.test(line)) {
      html += '<hr>\n';
      i++;
      continue;
    }
    if (line.trim() === '') { i++; continue; }
    var para = [];
    while (i < lines.length && lines[i].trim() !== '' && !isBlockStart(lines[i])) {
      para.push(lines[i].trim());
      i++;
    }
    html += '<p>' + inline(para.join(' ')) + '</p>\n';
  }
  return html;
}

loadPosts();
loadSettings();
$('footer-year').textContent = new Date().getFullYear();
applySettings();
renderHome();
</script>
